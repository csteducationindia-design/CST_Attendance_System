<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Scanner - CST AI</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; padding: 20px; margin: 0; }
        h2 { margin-bottom: 10px; }
        
        /* Scanner Box */
        #reader { 
            width: 100%; 
            max-width: 800px; 
            margin: 0 auto; 
            border: 4px solid #333; 
            border-radius: 10px; 
            background: white;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
        }
        
        /* 🚀 FIX: FLOATING POP-UP STATUS MESSAGE */
        #status { 
            position: fixed; 
            top: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 9999; 
            padding: 15px 40px; 
            border-radius: 50px; 
            font-weight: bold; 
            display: none; 
            font-size: 26px; 
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
            white-space: nowrap;
        }
        /* Make colors darker and text white so it pops on the screen! */
        .success { background-color: #28a745; color: white; border: 3px solid #1e7e34; }
        .error { background-color: #dc3545; color: white; border: 3px solid #bd2130; }
        .wait { background-color: #ffc107; color: black; border: 3px solid #d39e00; }

        /* Dashboard Button */
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
        }
        .back-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div id="status"></div>

    <a href="/dashboard" class="back-btn">⬅️ Back to Dashboard</a>
    <h2>📷 High-Speed CST Scanner</h2>
    
    <div id="reader"></div>

    <script>
        // 🎵 FUNCTION TO PLAY A "BEEP" SOUND
        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // Pitch

                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); // Volume
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                
                setTimeout(() => {
                    oscillator.stop();
                    audioCtx.close();
                }, 150); 
            } catch (e) {
                console.log("Audio not supported or blocked", e);
            }
        }

        let isScanning = true;
        let lastResult = "";

        function onScanSuccess(decodedText, decodedResult) {
            if (!isScanning || decodedText === lastResult) return;
            
            // 🔊 PLAY BEEP
            playBeep();
            
            isScanning = false;
            lastResult = decodedText;
            
            const statusDiv = document.getElementById("status");
            statusDiv.style.display = "block";
            statusDiv.className = "wait";
            statusDiv.innerText = "⏳ Processing...";

            let studentId = decodedText;
            if (decodedText.includes('/scan/')) {
                studentId = decodedText.split('/scan/')[1];
            }

            fetch('/scan/' + studentId)
                .then(response => response.json())
                .then(data => {
                    if(data.status === "ENTRY_MARKED" || data.status === "EXIT_MARKED") {
                        statusDiv.className = "success";
                        statusDiv.innerText = "✅ " + data.status;
                    } else if (data.status === "WAIT" || data.status === "ALREADY_EXITED") {
                        statusDiv.className = "wait";
                        statusDiv.innerText = "⚠️ " + data.message;
                    } else {
                        statusDiv.className = "error";
                        statusDiv.innerText = "❌ Error: " + (data.error || "Unknown");
                    }
                })
                .catch(err => {
                    statusDiv.className = "error";
                    statusDiv.innerText = "❌ Network Error";
                    console.error(err);
                })
                .finally(() => {
                    setTimeout(() => {
                        isScanning = true;
                        statusDiv.style.display = "none";
                        lastResult = ""; 
                    }, 2000);
                });
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { 
                fps: 30,                              
                qrbox: { width: 450, height: 450 },   
                aspectRatio: 1.333334                 
            });
        html5QrcodeScanner.render(onScanSuccess);
    </script>

</body>
</html>
