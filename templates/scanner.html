<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Scanner - CST AI</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; padding: 20px; margin: 0; }
        h2 { margin-bottom: 10px; }
        
        /* Scanner Box */
        #reader { 
            width: 100%; 
            max-width: 800px; 
            margin: 0 auto; 
            border: 4px solid #333; 
            border-radius: 10px; 
            background: white;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
        }
        
        /* Floating Pop-Up Status Message */
        #status { 
            position: fixed; 
            top: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 9999; 
            padding: 15px 40px; 
            border-radius: 50px; 
            font-weight: bold; 
            display: none; 
            font-size: 26px; 
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
            white-space: nowrap;
        }
        .success { background-color: #28a745; color: white; border: 3px solid #1e7e34; }
        .error { background-color: #dc3545; color: white; border: 3px solid #bd2130; }
        .wait { background-color: #ffc107; color: black; border: 3px solid #d39e00; }

        /* Dashboard Button */
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
        }
        .back-btn:hover { background-color: #0056b3; }

        /* Unlock Sound Button */
        #sound-btn {
            background-color: #28a745;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            animation: pulse 1.5s infinite;
        }
        #sound-btn:hover { background-color: #218838; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="status"></div>

    <a href="/dashboard" class="back-btn">⬅️ Back to Dashboard</a><br>
    
    <button id="sound-btn" onclick="enableSound()">🔊 Click Here to Enable Sound</button>

    <h2>📷 High-Speed CST Scanner</h2>
    
    <div id="reader"></div>

    <script>
        // 🔊 UNLOCK AUDIO FUNCTION
        function enableSound() {
            if ('speechSynthesis' in window) {
                // Speak a short confirmation to unlock the browser's audio engine
                let msg = new SpeechSynthesisUtterance("Sound is ready.");
                window.speechSynthesis.speak(msg);
                
                // Hide the button after clicking
                document.getElementById("sound-btn").style.display = "none";
            } else {
                alert("Your browser does not support voice audio.");
            }
        }

        // 🗣️ SMART SPEECH FUNCTION
        function speakMessage(textToSpeak) {
            if ('speechSynthesis' in window) {
                let msg = new SpeechSynthesisUtterance(textToSpeak);
                msg.rate = 1.0;  // Normal speed
                msg.pitch = 1.0; // Normal pitch
                
                // Cancel any currently speaking speech so it doesn't overlap
                window.speechSynthesis.cancel(); 
                window.speechSynthesis.speak(msg);
            }
        }

        let isScanning = true;
        let lastResult = "";

        function onScanSuccess(decodedText, decodedResult) {
            if (!isScanning || decodedText === lastResult) return;
            
            isScanning = false;
            lastResult = decodedText;
            
            const statusDiv = document.getElementById("status");
            statusDiv.style.display = "block";
            statusDiv.className = "wait";
            statusDiv.innerText = "⏳ Checking Database...";

            let studentId = decodedText;
            if (decodedText.includes('/scan/')) {
                studentId = decodedText.split('/scan/')[1];
            }

            // Call the API to check if it's an Entry or Exit
            fetch('/scan/' + studentId)
                .then(response => response.json())
                .then(data => {
                    if(data.status === "ENTRY_MARKED") {
                        statusDiv.className = "success";
                        statusDiv.innerText = "✅ " + data.status;
                        // 🗣️ Speak Welcome for Entry
                        speakMessage("Welcome to CST");
                        
                    } else if (data.status === "EXIT_MARKED") {
                        statusDiv.className = "success";
                        statusDiv.innerText = "✅ " + data.status;
                        // 🗣️ Speak Goodbye for Exit
                        speakMessage("Goodbye.");
                        
                    } else if (data.status === "WAIT" || data.status === "ALREADY_EXITED") {
                        statusDiv.className = "wait";
                        statusDiv.innerText = "⚠️ " + data.message;
                        speakMessage("Please wait.");
                        
                    } else {
                        statusDiv.className = "error";
                        statusDiv.innerText = "❌ Error: " + (data.error || "Unknown");
                        speakMessage("Error.");
                    }
                })
                .catch(err => {
                    statusDiv.className = "error";
                    statusDiv.innerText = "❌ Network Error";
                    speakMessage("Network Error.");
                    console.error(err);
                })
                .finally(() => {
                    setTimeout(() => {
                        isScanning = true;
                        statusDiv.style.display = "none";
                        lastResult = ""; 
                    }, 2000);
                });
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { 
                fps: 30,                              
                qrbox: { width: 450, height: 450 },   
                aspectRatio: 1.333334                 
            });
        html5QrcodeScanner.render(onScanSuccess);
    </script>

</body>
</html>
