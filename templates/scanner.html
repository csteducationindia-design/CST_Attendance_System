<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Scanner - CST AI</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; padding: 20px; }
        h2 { margin-bottom: 10px; }
        
        /* Scanner Box */
        #reader { 
            width: 100%; 
            max-width: 800px; 
            margin: 0 auto; 
            border: 4px solid #333; 
            border-radius: 10px; 
            background: white;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
        }
        
        /* Status Text */
        #status { margin-top: 20px; padding: 20px; border-radius: 8px; font-weight: bold; display: none; font-size: 28px; }
        .success { background-color: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
        .wait { background-color: #fff3cd; color: #856404; border: 2px solid #ffeeba; }

        /* Dashboard Button */
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
        }
        .back-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <a href="/dashboard" class="back-btn">⬅️ Back to Dashboard</a>
    <h2>📷 High-Speed CST Scanner</h2>
    
    <div id="reader"></div>
    <div id="status"></div>

    <script>
        // 🎵 FUNCTION TO PLAY A "BEEP" SOUND
        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // Pitch of the beep

                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); // Volume of the beep
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                
                // Stop the beep after 150 milliseconds
                setTimeout(() => {
                    oscillator.stop();
                    audioCtx.close();
                }, 150); 
            } catch (e) {
                console.log("Audio not supported or blocked by browser", e);
            }
        }

        let isScanning = true;
        let lastResult = "";

        function onScanSuccess(decodedText, decodedResult) {
            if (!isScanning || decodedText === lastResult) return;
            
            // 🔊 PLAY THE BEEP SOUND IMMEDIATELY!
            playBeep();
            
            isScanning = false;
            lastResult = decodedText;
            
            const statusDiv = document.getElementById("status");
            statusDiv.style.display = "block";
            statusDiv.className = "wait";
            statusDiv.innerText = "⏳ Processing...";

            // Extract student ID from the URL if it's a full URL
            let studentId = decodedText;
            if (decodedText.includes('/scan/')) {
                studentId = decodedText.split('/scan/')[1];
            }

            // Call the API
            fetch('/scan/' + studentId)
                .then(response => response.json())
                .then(data => {
                    if(data.status === "ENTRY_MARKED" || data.status === "EXIT_MARKED") {
                        statusDiv.className = "success";
                        statusDiv.innerText = "✅ " + data.status;
                    } else if (data.status === "WAIT" || data.status === "ALREADY_EXITED") {
                        statusDiv.className = "wait";
                        statusDiv.innerText = "⚠️ " + data.message;
                    } else {
                        statusDiv.className = "error";
                        statusDiv.innerText = "❌ Error: " + (data.error || "Unknown");
                    }
                })
                .catch(err => {
                    statusDiv.className = "error";
                    statusDiv.innerText = "❌ Network Error";
                    console.error(err);
                })
                .finally(() => {
                    // Resume scanning after 2 seconds
                    setTimeout(() => {
                        isScanning = true;
                        statusDiv.style.display = "none";
                        lastResult = ""; // Allow re-scanning
                    }, 2000);
                });
        }

        // Super Fast Detection Settings
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { 
                fps: 30,                              
                qrbox: { width: 450, height: 450 },   
                aspectRatio: 1.333334                 
            });
        html5QrcodeScanner.render(onScanSuccess);
    </script>

</body>
</html>
